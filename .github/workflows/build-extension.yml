name: ChurchTools-Extension bauen (ZIP)

# Baut die Extension und stellt eine installierbare ZIP bereit:
#  - bei jedem Push, der extension/ aendert
#  - manuell ueber den "Run workflow"-Knopf (Tab "Actions")
#  - bei einem Versions-Tag (v*) zusaetzlich als Release-Download
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'extension/**'
      - '.github/workflows/build-extension.yml'
    tags:
      - 'v*'

permissions:
  contents: write   # noetig, um bei Tags ein Release zu erstellen

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    env:
      # Modul-Key der Extension (muss zum Gateway VOCO_EXT_KEY passen)
      VITE_KEY: glockensteuerung
      # Zentraler Feedback-/Fehler-Endpunkt (optional): als Repository-Variable
      # anlegen (Settings -> Secrets and variables -> Actions -> Variables ->
      # VITE_FEEDBACK_URL). Leer = Feedback per mailto, keine Auto-Fehlermeldung.
      VITE_FEEDBACK_URL: ${{ vars.VITE_FEEDBACK_URL }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # volle History + Tags, damit `git describe` die Version findet

      - name: Auto-Version (Patch-Tag) bei Merge auf main
        id: bump
        if: github.ref == 'refs/heads/main'
        # Erhöht den Patch des letzten v-Tags (v0.4.0 -> v0.4.1) und setzt den Tag
        # VOR dem Build, damit `git describe` (package.js) die neue Version nimmt.
        # Fuer eine groessere Version einfach manuell einen Tag pushen (z. B.
        # v0.5.0) – der Auto-Bump zaehlt danach ab dort weiter.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          LATEST=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          LATEST=${LATEST:-v0.0.0}
          VER=${LATEST#v}; MA=${VER%%.*}; REST=${VER#*.}; MI=${REST%%.*}; PA=${REST##*.}
          NEXT="v${MA}.${MI}.$((PA + 1))"
          echo "Neuer Tag: $NEXT (bisher: $LATEST)"
          git tag "$NEXT"
          git push origin "$NEXT"
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Bauen und ZIP packen
        run: npm run deploy   # = build + scripts/package.js -> releases/*.zip

      - name: ZIP als Download bereitstellen (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: glockensteuerung-extension
          path: extension/releases/*.zip
          if-no-files-found: error

      - name: Bei Versions-Tag ein Release mit der ZIP erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Läuft im Arbeitsverzeichnis extension/ -> Pfad relativ dazu (releases/*.zip)
        # Idempotent: Release anlegen ODER (falls vorhanden) ZIP ersetzen.
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" releases/*.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" releases/*.zip \
              --title "Glockensteuerung ${GITHUB_REF_NAME}" \
              --notes "Automatisch gebaute ChurchTools-Extension. ZIP unten herunterladen und in ChurchTools installieren."
          fi

      - name: Release für den neuen Auto-Tag erstellen (nur main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Der per GITHUB_TOKEN gepushte Tag loest keinen weiteren Workflow aus,
        # daher wird das versionierte Release hier direkt erstellt.
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" releases/*.zip \
            --title "Glockensteuerung ${{ steps.bump.outputs.tag }}" \
            --notes "Automatischer Release bei Merge auf main."

      - name: Rollierendes "latest"-Release aktualisieren (nur main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Ein Release "latest" mit der fertigen, DIREKT installierbaren Einzel-ZIP.
        # Release-Dateien werden einzeln (unverpackt) heruntergeladen -> kein
        # ZIP-in-ZIP wie beim Actions-Artifact. Idempotent: anlegen oder ersetzen.
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest releases/*.zip --clobber
          else
            gh release create latest releases/*.zip \
              --prerelease --title "Aktueller Build (main)" \
              --notes "Automatisch gebaute, **direkt installierbare** ChurchTools-ZIP vom letzten main-Stand. Einzelne Datei herunterladen und unveraendert hochladen (kein Entpacken noetig)."
          fi
