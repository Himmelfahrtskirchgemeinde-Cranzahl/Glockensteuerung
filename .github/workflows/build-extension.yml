name: ChurchTools-Extension bauen (ZIP)

# Baut die Extension und stellt eine installierbare ZIP bereit:
#  - bei jedem Push, der extension/ aendert
#  - manuell ueber den "Run workflow"-Knopf (Tab "Actions")
#  - bei einem Versions-Tag (v*) zusaetzlich als Release-Download
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'extension/**'
      - '.github/workflows/build-extension.yml'
    tags:
      - 'v*'

permissions:
  contents: write   # noetig, um bei Tags ein Release zu erstellen

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    env:
      # Modul-Key der Extension (muss zum Gateway VOCO_EXT_KEY passen)
      VITE_KEY: glockensteuerung
      # Zentraler Feedback-/Fehler-Endpunkt (optional): als Repository-Variable
      # anlegen (Settings -> Secrets and variables -> Actions -> Variables ->
      # VITE_FEEDBACK_URL). Leer = Feedback per mailto, keine Auto-Fehlermeldung.
      VITE_FEEDBACK_URL: ${{ vars.VITE_FEEDBACK_URL }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # volle History + Tags, damit `git describe` die Version findet

      - name: Auto-Version (Patch-Tag) bei Merge auf main
        id: bump
        if: github.ref == 'refs/heads/main'
        # Erhöht den Patch des letzten v-Tags (v0.4.0 -> v0.4.1) und setzt den Tag
        # VOR dem Build, damit `git describe` (package.js) die neue Version nimmt.
        # Fuer eine groessere Version einfach manuell einen Tag pushen (z. B.
        # v0.5.0) – der Auto-Bump zaehlt danach ab dort weiter.
        run: |
          # Hauptversion = zweistellige Jahreszahl (2026 -> 26, 2027 -> 27).
          # Wird automatisch aus dem aktuellen Datum abgeleitet: Der erste Merge
          # im neuen Jahr startet von selbst bei v27.0.0.
          MAJOR=$(date +%y)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          LATEST=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          LATEST=${LATEST:-v0.0.0}
          VER=${LATEST#v}; MA=${VER%%.*}; REST=${VER#*.}; MI=${REST%%.*}; PA=${REST##*.}
          # 10# erzwingt Basis 10 (sonst waere z. B. "08" eine ungueltige Oktalzahl).
          MA=$((10#$MA)); MI=$((10#$MI)); PA=$((10#$PA))
          # Schema:  <Jahr zweistellig>.<Mittelstelle>.<Patch>
          #   - Patch laeuft nur bis 9, dann Uebertrag:      v26.6.9 -> v26.7.0
          #   - Die Mittelstelle zaehlt unbegrenzt weiter:   v26.9.9 -> v26.10.0
          #   - Neues Jahr faengt wieder bei .0.0 an:        v26.12.3 -> v27.0.0
          if [ "$MA" -lt "$MAJOR" ]; then
            # Neues Jahr (oder alte Zaehlung wie v0.4.x) -> bei .0.0 starten.
            MA=$MAJOR; MI=0; PA=0
          else
            PA=$((PA + 1))
            if [ "$PA" -gt 9 ]; then PA=0; MI=$((MI + 1)); fi
          fi
          NEXT="v${MA}.${MI}.${PA}"
          echo "Neuer Tag: $NEXT (bisher: $LATEST)"
          git tag "$NEXT"
          git push origin "$NEXT"
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Bauen und ZIP packen
        run: npm run deploy   # = build + scripts/package.js -> releases/*.zip

      - name: Gateway als ZIP packen
        # Landet neben der Extension-ZIP, damit beide denselben Weg nehmen:
        # Artifact, Release, Dauerlink. Die Versionsnummer holt sich das Skript
        # aus 'git describe' - dieselbe Quelle wie scripts/package.js.
        run: bash ../.github/scripts/gateway-zip.sh releases

      - name: ZIP als Download bereitstellen (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: glockensteuerung-extension
          path: extension/releases/*.zip
          if-no-files-found: error
        # Enthaelt beide Archive: die Erweiterung und den Gateway-Dienst.

      - name: Bei Versions-Tag ein Release mit der ZIP erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Läuft im Arbeitsverzeichnis extension/ -> Pfade relativ dazu.
        # Legt das Release dieser Version an (z. B. "Version 26.6.1").
        run: bash ../.github/scripts/release.sh "${GITHUB_REF_NAME}" releases/*.zip

      - name: Release für den neuen Auto-Tag erstellen (nur main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Der per GITHUB_TOKEN gepushte Tag loest keinen weiteren Workflow aus,
        # daher wird das Release hier direkt erstellt/erweitert.
        run: bash ../.github/scripts/release.sh "${{ steps.bump.outputs.tag }}" releases/*.zip

      # Das rollierende "latest"-Release ist entfallen: Es lebte davon, seine ZIP
      # bei jedem Merge zu ersetzen - mit unveraenderlichen Releases geht das
      # nicht mehr. Den Dauerlink liefert jetzt GitHub selbst, weil jedes
      # Versions-Release eine 'glockensteuerung.zip' unter festem Namen traegt:
      #   .../releases/latest/download/glockensteuerung.zip
